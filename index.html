<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Fonima 3D — Williams Street, Freetown</title>
    <meta name="description" content="Playable 3D open-world adventure in Sierra Leone — explore No. 22 Williams Street, drive the 4x4 SUV along the highway, and reach Bo City." />
    <meta property="og:title" content="Fonima 3D — Williams Street, Freetown" />
    <meta property="og:description" content="Playable 3D open-world adventure in Sierra Leone — explore No. 22 Williams Street, drive the 4x4 SUV along the highway, and reach Bo City." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fonima 3D" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600&family=Syne:wght@600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      html, body {
        width: 100%;
        height: 100%;
        width: 100dvw;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #020617;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #root {
        width: 100%;
        height: 100%;
        width: 100dvw;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      /* Orientation Guard (Rotate Phone) */
      #orientation-guard {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #f8fafc;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      @media screen and (orientation: portrait), (max-aspect-ratio: 1/1) {
        #orientation-guard {
          display: flex !important;
        }
      }
      @keyframes phone-rotate {
        0%, 15% {
          transform: rotate(0deg);
        }
        50%, 65% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
      .phone-icon-anim {
        animation: phone-rotate 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: center center;
      }

      /* Initial Loading Screen (Before React Loads) */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #f8fafc;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 0.6s ease;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-white overflow-hidden select-none touch-none">
    <!-- Orientation Guard for Portrait Mode -->
    <div id="orientation-guard" role="alert" aria-live="assertive">
      <div style="width: 80px; height: 80px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center;">
        <svg class="phone-icon-anim" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2.5" ry="2.5"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
          <line x1="10" y1="5" x2="14" y2="5"></line>
        </svg>
      </div>
      <h2 style="font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; margin: 0 0 8px; letter-spacing: 0.02em; color: #ffffff;">
        Rotate Your Phone
      </h2>
      <p style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; color: #94a3b8; margin: 0; max-width: 280px; line-height: 1.5;">
        Fonima 3D is designed for landscape play. Rotate your device to continue.
      </p>
    </div>

    <!-- Initial Loading Screen -->
    <div id="initial-loader" aria-label="Loading Fonima 3D">
      <div style="display: flex; flex-direction: column; align-items: center; max-width: 380px; width: 85%; text-align: center;">
        <div style="font-family: 'Syne', sans-serif; font-size: clamp(32px, 6vw, 44px); font-weight: 800; letter-spacing: 0.08em; color: #ffffff; text-shadow: 0 0 30px rgba(245,158,11,0.25);">
          FONIMA 3D
        </div>
        <div style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(11px, 2.2vw, 13px); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #f59e0b; margin: 6px 0 28px;">
          Williams Street · Freetown to Bo City
        </div>

        <!-- Progress bar container -->
        <div style="width: 100%; height: 8px; background: rgba(30, 41, 59, 0.9); border-radius: 9999px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); padding: 1px; box-sizing: border-box;">
          <div id="loading-bar-fill" style="width: 5%; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #f59e0b, #10b981, #38bdf8); transition: width 0.3s ease-out;"></div>
        </div>

        <!-- Progress status & percentage -->
        <div style="display: flex; justify-content: space-between; width: 100%; margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #94a3b8;">
          <span id="loading-status-text">Loading game engine...</span>
          <span id="loading-percent-text">5%</span>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script>
      window.__setLoadingProgress = function(percent, status) {
        var bar = document.getElementById('loading-bar-fill');
        var pText = document.getElementById('loading-percent-text');
        var sText = document.getElementById('loading-status-text');
        if (bar) bar.style.width = Math.min(100, Math.max(0, percent)) + '%';
        if (pText) pText.textContent = Math.round(percent) + '%';
        if (sText && status) sText.textContent = status;
      };
      window.__hideInitialLoader = function() {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 600);
        }
      };
    </script>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Register service worker for offline app-shell caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then((reg) => {
              console.log('Fonima 3D SW registered:', reg.scope);
            })
            .catch((err) => {
              console.warn('SW registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
